<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <title>Money</title>

    <!-- PWA: lets iOS/Android "Add to Home Screen" behave like an installed app.
         Paths are relative so this works both under the Capacitor local build
         and the GitHub Pages subpath the web version is hosted at. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-32.png" sizes="32x32" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Money" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Set data-theme before first paint so there is no flash of the wrong
      // theme -- src/lib/theme.ts keeps this in sync from here on.
      (function () {
        try {
          var pref = localStorage.getItem('ft-theme');
          var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
