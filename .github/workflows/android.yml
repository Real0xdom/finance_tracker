name: Build Android APK

# Produces an installable debug APK as a downloadable artifact. Debug APKs are
# signed with the standard Android debug key, which is all that is needed to
# sideload onto your own phone (no Play Store involved).

on:
  push:
    branches: [finance-tracker, main]
    paths: ['tracker/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # the release step needs to create tags and releases in this repo
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tracker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        env:
          # Read from the Secrets tab first, falling back to the Variables tab --
          # both live under Settings -> Secrets and variables -> Actions, and it is
          # easy to add them to the wrong one. The anon key is a publishable client
          # key; row level security is what actually protects the data.
          FT_SUPABASE_URL: ${{ secrets.FT_SUPABASE_URL || vars.FT_SUPABASE_URL }}
          FT_SUPABASE_ANON_KEY: ${{ secrets.FT_SUPABASE_ANON_KEY || vars.FT_SUPABASE_ANON_KEY }}
        run: |
          # report each name separately, so a failure says which one is missing
          # (lengths only -- never the values themselves)
          echo "FT_SUPABASE_URL:      ${FT_SUPABASE_URL:+present} (${#FT_SUPABASE_URL} chars)"
          echo "FT_SUPABASE_ANON_KEY: ${FT_SUPABASE_ANON_KEY:+present} (${#FT_SUPABASE_ANON_KEY} chars)"

          if [ -z "$FT_SUPABASE_URL" ] || [ -z "$FT_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing config. Check Settings -> Secrets and variables -> Actions."
            echo "::error::Names must match exactly: FT_SUPABASE_URL, FT_SUPABASE_ANON_KEY."
            echo "::error::They must be under the 'Secrets' (or 'Variables') tab for Actions -- Dependabot secrets are not visible here."
            exit 1
          fi

          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: tracker/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/money-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: money-apk
          path: tracker/out/*.apk
          if-no-files-found: error
          retention-days: 30

      # Artifacts only download as a .zip, which is painful on a phone. The
      # release gives a direct .apk link the phone browser can install from.
      - name: Publish to the "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          body: |
            Debug-signed APK for sideloading — built from `${{ github.sha }}`.

            Open this page on your phone and tap the `.apk` below to install.
          files: tracker/out/*.apk
          # one moving tag, so the phone can always bookmark the same page
          make_latest: true
