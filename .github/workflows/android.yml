name: Build Android APK

# Produces an installable debug APK as a downloadable artifact. Debug APKs are
# signed with the standard Android debug key, which is all that is needed to
# sideload onto your own phone (no Play Store involved).

on:
  push:
    branches: [finance-tracker, main]
    paths: ['tracker/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        env:
          # Add these under Settings -> Secrets and variables -> Actions.
          # The anon key is a publishable client key; row level security is what
          # actually protects the data.
          FT_SUPABASE_URL: ${{ secrets.FT_SUPABASE_URL }}
          FT_SUPABASE_ANON_KEY: ${{ secrets.FT_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$FT_SUPABASE_URL" ] || [ -z "$FT_SUPABASE_ANON_KEY" ]; then
            echo "::error::FT_SUPABASE_URL and FT_SUPABASE_ANON_KEY repository secrets are not set."
            exit 1
          fi
          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: tracker/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/money-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: money-apk
          path: tracker/out/*.apk
          if-no-files-found: error
          retention-days: 30
