name: Build Android APK

# Produces an installable debug APK as a downloadable artifact. Debug APKs are
# signed with the standard Android debug key, which is all that is needed to
# sideload onto your own phone (no Play Store involved).

on:
  push:
    branches: [finance-tracker, main]
    paths: ['tracker/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # the release step needs to create tags and releases in this repo
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tracker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        env:
          # Optional override. Config normally comes from the committed
          # tracker/.env.production, so the build does not depend on these
          # being present -- an empty value is ignored, not treated as a blank.
          FT_SUPABASE_URL: ${{ secrets.FT_SUPABASE_URL || vars.FT_SUPABASE_URL }}
          FT_SUPABASE_ANON_KEY: ${{ secrets.FT_SUPABASE_ANON_KEY || vars.FT_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify the bundle carries the Supabase config
        # Catches a bad or placeholder key here rather than on the phone, where
        # the only symptom would be a login that never works.
        run: |
          if ! grep -rq "supabase.co" dist/assets; then
            echo "::error::Built bundle has no Supabase URL in it -- check tracker/.env.production."
            exit 1
          fi
          if grep -rq "PASTE_YOUR_ANON_KEY_HERE" dist/assets; then
            echo "::error::tracker/.env.production still has the placeholder anon key."
            exit 1
          fi
          echo "Supabase config is present in the bundle."

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: tracker/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          # a sha-tagged copy for the artifact history, and a fixed name for the
          # release -- the release upload replaces same-named assets, so this
          # one file is what keeps the release page down to a single download
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/money-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk out/money-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: money-apk
          path: tracker/out/money-*.apk
          if-no-files-found: error
          retention-days: 30

      # Artifacts only download as a .zip, which is painful on a phone. The
      # release gives a direct .apk link the phone browser can install from.
      - name: Remove stray assets from an earlier run
        # One-time cleanup for assets uploaded before this file used a fixed
        # name (money-<sha>.apk). Safe to keep permanently: it is a no-op once
        # the release only ever holds money-latest.apk.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-apk --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' 2>/dev/null | grep -v '^money-latest\.apk$' | while read -r name; do
            gh release delete-asset latest-apk "$name" --repo "${{ github.repository }}" -y || true
          done
        continue-on-error: true

      - name: Publish to the "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          body: |
            Debug-signed APK for sideloading — built from `${{ github.sha }}`.

            Open this page on your phone and tap `money-latest.apk` below to install.
          files: tracker/out/money-latest.apk
          # one moving tag, so the phone can always bookmark the same page
          make_latest: true
